[project]
name = "aisha"
version = "0.20.1"
description = "AI content generation service with bundle-based deployment automation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Miša" }]
keywords = ["ai", "image-generation", "video-generation", "deployment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.2",
    "typer>=0.12.0",
    "rich>=13.9.0",
    "aiofiles>=24.1.0",
    "tenacity>=9.0.0",
    "structlog>=24.4",
    "uuid-utils>=0.17.0",
    # hf_xet is the Rust Xet CAS client HfXetTransport needs -- see
    # hf_xet_transport.py. A base dependency, not an optional extra: a node
    # that can't use it downloads 25x slower, which is a broken install.
    "huggingface_hub[hf_xet]>=1.26.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "diff-cover>=10.5",
    "ruff>=0.15,<0.17",
    "mypy>=2.1,<2.4",
    "pyright>=1.1.380",
    "pre-commit>=3.8.0",
    "types-pyyaml>=6.0.12.20260518,<6.0.13",
    "types-aiofiles>=25.1.0.20260518,<25.2",
]
[project.scripts]
acs = "ai_content_service.cli:app"

[project.urls]
Homepage = "https://github.com/gearbox/aisha"
Documentation = "https://github.com/gearbox/aisha#readme"
Repository = "https://github.com/gearbox/aisha"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_content_service"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C901",   # mccabe cyclomatic complexity
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "ISC",    # Catches the missing-comma-in-a-list silent string-join bug
    "PIE",    # Misc linters
    "RET",    # flake8-return
    "DTZ",    # flake8-datetimez enforces tz-aware datetimes
    "TID",    # Bans relative imports
    "TC",     # flake8-type-checking, moves typing-only imports into TYPE_CHECKING
    "PLE",    # Pylint errors
    "PLR",    # Pylint refactor rules
    # "PLW",    # Pylint warnings
    "FA",     # flake8-future-annotations
    "PGH",    # pygrep-hooks, bans blanket # type: ignore and # noqa
    "FLY",    # F-string formatting style
    "ANN",    # Type annotations
    "ASYNC",  # flake8-async enforces async discipline
    "S",      # Enables all Bandit security rules
    "TRY",    # exception hygiene
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "B008",     # do not perform function calls in argument defaults
    "ASYNC240", # pathlib in async fn — coverage is receiver-type-dependent and
                # inverted (fires on stat(), misses shutil.copy2). Superseded by
                # the explicit to_thread policy in CLAUDE.md / this module's docs.
    "ISC001",   # conflicts with `ruff format` (Ruff formatter-compatibility list);
                # ISC004 is what catches missing-comma implicit concatenation
    "TRY003",   # Long messages at the raise site are this codebase's established style (220 findings)
    "TRY004",   # Ruff wants TypeError for isinstance checks, but pydantic field validators
                # convert ValueError into ValidationError and let TypeError escape raw.
                # Correct for this codebase, permanently — not a grandfathering concession.
]

[tool.ruff.lint.per-file-ignores]
"src/ai_content_service/download_auth.py" = [
    "UP047", # Keep the established TypeVar-based callable signature stable
    "PLR0913", # Existing auth adapter keeps its stable public parameters
]
"src/ai_content_service/additive_preflight.py" = [
    "C901", # Existing additive validator intentionally reports every independent finding
    "PLR0912", # Existing additive validator keeps independent policy branches explicit
]
"src/ai_content_service/bundle_contract.py" = [
    "C901", # Existing contract checks retain all independent diagnostics in one pass
    "PLR0912", # Existing contract checks keep user-facing policy branches explicit
    "PLR0913", # Existing contract helpers accept the stable validation context
    "PLR0915", # Existing validators prioritize complete diagnostics over early exit
    "PLR2004", # ComfyUI-Manager gui_mode values and workflow link/tuple arities
    "TRY301", # Raise-then-convert inside try blocks; revisit per call site, not in bulk
]
"src/ai_content_service/bundle_contract_service.py" = [
    "PLR0913", # Existing composition roots assemble contract-validation dependencies
]
"src/ai_content_service/bundle_operations.py" = [
    "PLR0913", # Existing command composition roots expose injected dependencies explicitly
]
"src/ai_content_service/bundle_registry.py" = [
    "PLR0913", # Existing registry constructor has a stable configuration boundary
]
"src/ai_content_service/cache_service.py" = [
    "PLR0913", # Existing cache verifier accepts its explicit verification context
]
"src/ai_content_service/cache_workflows.py" = [
    "PLR0913", # Existing cache workflow boundary keeps dependency injection explicit
]
"src/ai_content_service/callback_client.py" = [
    "PLR0911", # Existing response adapter returns early for each protocol outcome
]
"src/ai_content_service/cli.py" = [
    "C901", # Existing CLI commands preserve independent option validation paths
    "PLR0912", # Existing CLI commands keep user-facing branches explicit
    "PLR0913", # Typer composition roots intentionally expose their options and dependencies
    "PLR0915", # Existing CLI commands render all actionable diagnostics in one pass
    "TRY301", # Raise-then-convert inside try blocks; revisit per call site, not in bulk
]
"src/ai_content_service/comfyui.py" = [
    "C901", # Existing lifecycle operations preserve their explicit recovery paths
    "PLR0912", # Existing lifecycle operations keep readiness branches explicit
    "PLR2004", # Path-component arity and the ZIP spec's create_system 3 (Unix)
    "TRY301", # Raise-then-convert inside try blocks; revisit per call site, not in bulk
]
"src/ai_content_service/command_executor.py" = [
    "PLR0911", # Existing command dispatcher returns directly for each terminal outcome
    "PLR0913", # Existing command adapter keeps its execution context explicit
]
"src/ai_content_service/config.py" = [
    "C901", # Existing configuration validators preserve complete error reporting
    "PLR0912", # Existing configuration validators keep field-specific branches explicit
    "PLR2004", # Minimum hostname label count
]
"src/ai_content_service/cache_credentials.py" = [
    "TRY301", # Raise-then-convert inside try blocks; revisit per call site, not in bulk
]
"tests/test_cache_workflows.py" = [
    "UP047", # Keep the established TypeVar-based coroutine helper stable
]
"src/ai_content_service/deployer.py" = [
    "C901", # Existing deployment orchestration preserves explicit failure recovery
    "PLR0912", # Existing deployment orchestration keeps lifecycle branches explicit
    "PLR0913", # Existing deployment composition roots expose injected dependencies
    "PLR0915", # Existing deployment plan reports all steps rather than hiding branches
]
"src/ai_content_service/downloader.py" = [
    "C901", # Existing transfer paths preserve independent retry and integrity decisions
    "PLR0912", # Existing transfer paths keep retry and integrity branches explicit
    "PLR0913", # Existing download adapters keep transfer context explicit
    "PLR0915", # Existing transfer routines preserve complete progress behavior
]
"src/ai_content_service/models_service.py" = [
    "PLR0913", # Existing model composition root keeps injected services explicit
]
"src/ai_content_service/operation_telemetry.py" = [
    "PLR0913", # Existing telemetry boundary carries the complete operation context
]
"src/ai_content_service/preflight.py" = [
    "PLR0913", # Existing preflight adapter keeps its explicit verification context
]
"src/ai_content_service/r2_transfer.py" = [
    "PLR0913", # Existing R2 adapter keeps transfer configuration explicit
]
"src/ai_content_service/registry_service.py" = [
    "PLR0913", # Existing registry composition root preserves explicit dependencies
]
"src/ai_content_service/remover.py" = [
    "C901", # Existing removal plan preserves independent safety decisions
    "PLR0912", # Existing removal plan keeps safety branches explicit
]
"src/ai_content_service/snapshot.py" = [
    "C901", # Existing snapshot workflows preserve independent capture and recovery paths
    "PLR0911", # Existing snapshot parsing returns directly for each input form
    "PLR0912", # Existing snapshot workflows keep safety and provenance branches explicit
    "PLR0913", # Existing snapshot composition roots expose their capture context
    "PLR0915", # Existing snapshot routines preserve complete artifact diagnostics
    "PLR2004", # Path-component arity
    "TRY301", # Raise-then-convert inside try blocks; revisit per call site, not in bulk
]
"src/ai_content_service/workflow_map.py" = [
    "C901", # Existing mapper preserves all independent inference paths
    "PLR0911", # Existing mapper returns directly for each resolved form
    "PLR0912", # Existing mapper keeps inference branches explicit
    "PLR2004", # Workflow link pair arity
]
"tests/test_models_service.py" = [
    "UP047", # Keep the established TypeVar-based coroutine helper stable
]
"tests/**/*.py" = [
    "ANN002", # Missing type annotation for function argument
    "ANN003", # Missing type annotation for function kw argument
    "ANN202", # Missing return type annotation for private function
    "S101",   # Use of `assert` detected
    "S104",   # Possible binding to all interfaces
    "S105",   # Ignore hardcoded password rules in any file within the tests directory
    "S106",   # Ignore possible hardcoded password assigned to argument within the tests directory
    "S107",   # Ignore possible hardcoded password assigned to function default within the tests directory
    "S108",   # Probable insecure usage of temporary file or directory
    "S603",   # `subprocess` call: check for execution of untrusted input
    "S607",   # Ignore starting a process with a partial executable path
    "PLR0913", # Test helpers accept fixtures and parameterized scenario inputs explicitly
    "PLR2004", # Assertions intentionally use literal expected values
]

[tool.ruff.lint.isort]
known-first-party = ["ai_content_service"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pyright]
include = ["src", "scripts", "tests"]
extraPaths = ["scripts"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiofiles.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hf_xet.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --cov=ai_content_service --cov-report=term-missing"

[tool.coverage.run]
source = ["src/ai_content_service"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
