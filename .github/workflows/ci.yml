name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: make lint

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        # 88% leaves headroom for tests/scripts/ environmental variance; ratchet up over time.
        run: >-
          .venv/bin/pytest tests/ -v --cov=ai_content_service --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-fail-under=88

      - name: Upload canonical coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  diff-coverage:
    name: Coverage on new code
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # diff-cover resolves the merge-base; a shallow checkout has none and
          # would silently report every line in a changed file as new.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: uv sync --frozen --extra dev

      - name: Download canonical coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage

      - name: Validate coverage report
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("coverage.xml")
          if not report.is_file() or report.stat().st_size == 0:
              raise SystemExit("coverage.xml is missing or empty")

          root = ElementTree.parse(report).getroot()
          line_rate = float(root.attrib.get("line-rate", "0"))
          filenames = [
              item.attrib["filename"]
              for item in root.findall("./packages/package/classes/class")
              if "filename" in item.attrib
          ]
          if line_rate <= 0:
              raise SystemExit("coverage.xml has no covered lines")
          if not any(name.startswith("src/ai_content_service/") for name in filenames):
              raise SystemExit("coverage.xml has no ai_content_service source paths")
          PY

      - name: Diff coverage
        run: |
          .venv/bin/diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=85 \
            --markdown-report diff-cover.md
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
