name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: make lint

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        # 88% leaves headroom for tests/scripts/ environmental variance; ratchet up over time.
        run: >-
          .venv/bin/pytest tests/ -v --cov=ai_content_service --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-fail-under=88

      - name: Upload canonical Sonar coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-sonar
          path: coverage.xml
          if-no-files-found: error

  sonar:
    name: SonarQube Cloud
    needs: [lint, test]
    # GitHub does not provide repository secrets to fork pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar uses SCM history to calculate new-code attribution.
          fetch-depth: 0

      - name: Download canonical coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage-sonar

      - name: Validate coverage report
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("coverage.xml")
          if not report.is_file() or report.stat().st_size == 0:
              raise SystemExit("coverage.xml is missing or empty")

          root = ElementTree.parse(report).getroot()
          line_rate = float(root.attrib.get("line-rate", "0"))
          filenames = [
              item.attrib["filename"]
              for item in root.findall("./packages/package/classes/class")
              if "filename" in item.attrib
          ]
          if line_rate <= 0:
              raise SystemExit("coverage.xml has no covered lines")
          if not any(name.startswith("src/ai_content_service/") for name in filenames):
              raise SystemExit("coverage.xml has no ai_content_service source paths")
          PY

      # Automatic Analysis must be disabled in SonarQube Cloud before this job
      # is enabled; see .github/SONARQUBE.md for the required project setup.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
